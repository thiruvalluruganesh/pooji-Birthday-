<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pixel Photo Reveal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #finalImage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <div class="loading">Loading...</div>
  <canvas id="canvas"></canvas>

  <!-- Google image -->
  <img
    id="finalImage"
    src=IMG-20260624-WA0013.jpg"
    alt="Nature landscape"
  />

  <script>
    /* =========================
       SETTINGS
    ========================= */

    // Google image URL
    const IMAGE_NAME = "https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80";

    /*
      TOTAL REVEAL TIME

      3000 = fast
      5000 = medium
      7000 = slow
      9000 = very slow
    */
    const REVEAL_TIME = 6000;

    /*
      PIXEL SPACING

      3 = many pixels
      4 = detailed
      5 = balanced
      6 = faster
    */
    const PARTICLE_STEP = 5;

    // Size of each particle
    const PARTICLE_SIZE = 3;

    // How long each pixel takes to pop into existence
    const POP_DURATION = 350;

    // Maximum brightness boost
    const BRIGHTNESS = 1.22;


    /* =========================
       ELEMENTS
    ========================= */

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const loadingElement = document.querySelector('.loading');

    const finalImage = document.getElementById("finalImage");

    const image = new Image();
    image.crossOrigin = "Anonymous"; // Needed for CORS-enabled images
    image.src = IMAGE_NAME;


    /* =========================
       VARIABLES
    ========================= */

    let width = 0;
    let height = 0;

    let imageWidth = 0;
    let imageHeight = 0;

    let imageX = 0;
    let imageY = 0;

    let particles = [];
    let animationStart = 0;


    /* =========================
       CANVAS
    ========================= */

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width;
      canvas.height = height;

      calculateImageSize();
    }


    /* =========================
       IMAGE SIZE
    ========================= */

    function calculateImageSize() {
      if (!image.complete || !image.naturalWidth) {
        return;
      }

      const imageRatio = image.naturalWidth / image.naturalHeight;
      const screenRatio = width / height;

      // Cover the screen, like object-fit: cover
      if (imageRatio > screenRatio) {
        imageHeight = height;
        imageWidth = height * imageRatio;
      } else {
        imageWidth = width;
        imageHeight = width / imageRatio;
      }

      imageX = (width - imageWidth) / 2;
      imageY = (height - imageHeight) / 2;
    }


    /* =========================
       CREATE PARTICLES
    ========================= */

    function createParticles() {
      particles = [];

      if (!image.complete || !image.naturalWidth) {
        return;
      }

      calculateImageSize();

      /*
        Draw the source image to an offscreen canvas so we can
        read its pixels.
      */
      const offscreen = document.createElement("canvas");
      const offCtx = offscreen.getContext("2d");

      offscreen.width = image.naturalWidth;
      offscreen.height = image.naturalHeight;

      offCtx.drawImage(
        image,
        0,
        0,
        image.naturalWidth,
        image.naturalHeight
      );

      const pixels = offCtx.getImageData(
        0,
        0,
        image.naturalWidth,
        image.naturalHeight
      ).data;

      for (
        let y = 0;
        y < image.naturalHeight;
        y += PARTICLE_STEP
      ) {
        for (
          let x = 0;
          x < image.naturalWidth;
          x += PARTICLE_STEP
        ) {
          const index =
            (y * image.naturalWidth + x) * 4;

          const r = pixels[index];
          const g = pixels[index + 1];
          const b = pixels[index + 2];
          const a = pixels[index + 3];

          if (a === 0) {
            continue;
          }

          /*
            Convert original image coordinates to
            screen coordinates.
          */
          const screenX =
            imageX + (x / image.naturalWidth) * imageWidth;

          const screenY =
            imageY + (y / image.naturalHeight) * imageHeight;

          particles.push({
            x: screenX,
            y: screenY,

            r: Math.min(255, r * BRIGHTNESS),
            g: Math.min(255, g * BRIGHTNESS),
            b: Math.min(255, b * BRIGHTNESS),

            alpha: a / 255,

            // Random starting delay
            delay: Math.random() * REVEAL_TIME,

            // Individual particle animation duration
            duration:
              POP_DURATION * (0.7 + Math.random() * 0.6)
          });
        }
      }
    }


    /* =========================
       ANIMATION
    ========================= */

    function animate(timestamp) {
      if (!animationStart) {
        animationStart = timestamp;
      }

      const elapsed = timestamp - animationStart;

      ctx.clearRect(0, 0, width, height);

      for (const particle of particles) {
        const particleStart = particle.delay;

        let progress =
          (elapsed - particleStart) / particle.duration;

        progress = Math.max(0, Math.min(1, progress));

        /*
          Smooth "pop" effect.
        */
        const eased =
          1 - Math.pow(1 - progress, 3);

        if (progress <= 0) {
          continue;
        }

        ctx.globalAlpha =
          particle.alpha * eased;

        ctx.fillStyle =
          `rgb(${particle.r}, ${particle.g}, ${particle.b})`;

        ctx.fillRect(
          particle.x,
          particle.y,
          PARTICLE_SIZE,
          PARTICLE_SIZE
        );
      }

      ctx.globalAlpha = 1;

      /*
        Once the particle reveal is finished,
        show the normal image.
      */
      if (elapsed >= REVEAL_TIME + POP_DURATION) {
        finalImage.style.opacity = "1";
        loadingElement.style.display = 'none';

        setTimeout(() => {
          ctx.clearRect(0, 0, width, height);
        }, 1000);

        return;
      }

      requestAnimationFrame(animate);
    }


    /* =========================
       START
    ========================= */

    image.onload = () => {
      resize();
      createParticles();
      loadingElement.style.display = 'none';

      animationStart = 0;
      requestAnimationFrame(animate);
    };
    
    image.onerror = () => {
      loadingElement.textContent = 'Error loading image';
    };


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener("resize", () => {
      resize();

      if (image.complete) {
        createParticles();
      }
    });
  </script>

</body>
</html>
